<svg width="880" height="260" viewBox="0 0 880 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181119" />
      <stop offset="45%" stop-color="#231326" />
      <stop offset="100%" stop-color="#140c16" />
    </linearGradient>

    <!-- Header / Brand Gradient -->
    <linearGradient id="pink-violet-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff69b4" />
      <stop offset="40%" stop-color="#ee50a5" />
      <stop offset="75%" stop-color="#be54e6" />
      <stop offset="100%" stop-color="#8e44ad" />
    </linearGradient>

    <linearGradient id="neko-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee50a5" />
      <stop offset="100%" stop-color="#8e44ad" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dot Grid Pattern -->
    <pattern id="dot-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="#8e44ad" fill-opacity="0.18" />
    </pattern>
  </defs>

  <style>
    .font-title {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #e8dbeb;
      letter-spacing: 0.2px;
    }
    .font-tagline {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 400;
      font-size: 12.5px;
      fill: #b39ab8;
      letter-spacing: 0.4px;
    }
    .font-badge {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      fill: #fcd5ec;
    }
    .font-mono-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      fill: #a389ab;
    }
  </style>

  <!-- Container Box with Double Border -->
  <rect width="880" height="260" rx="16" fill="url(#bg-grad)" />
  <rect width="880" height="260" rx="16" fill="url(#dot-grid)" />

  <!-- Outer Double Violet Border -->
  <rect x="2" y="2" width="876" height="256" rx="15" stroke="#8e44ad" stroke-width="1.6" stroke-opacity="0.85" />
  <rect x="6" y="6" width="868" height="248" rx="11" stroke="#5c2c74" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Top Terminal Bar Mockup -->
  <line x1="6" y1="42" x2="874" y2="42" stroke="#5c2c74" stroke-width="1" stroke-opacity="0.5" />
  
  <!-- Terminal Control Dots (Cute Colors) -->
  <circle cx="28" cy="24" r="5.5" fill="#ee50a5" />
  <circle cx="46" cy="24" r="5.5" fill="#be54e6" />
  <circle cx="64" cy="24" r="5.5" fill="#8e44ad" />

  <text x="88" y="28" class="font-mono-tag">cinlodev@cute-machine:~</text>

  <!-- Status Pill (Top Right) -->
  <g transform="translate(680, 13)">
    <rect width="170" height="22" rx="11" fill="#26142a" stroke="#ee50a5" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="11" r="3.5" fill="#10B981" />
    <text x="24" y="15" class="font-badge" fill="#e0d6e6" font-size="10.5">OPEN TO WORK &amp; BUILD</text>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="160" cy="130" r="85" fill="#ee50a5" fill-opacity="0.12" filter="url(#glow-pink)" />
  <circle cx="700" cy="140" r="95" fill="#8e44ad" fill-opacity="0.14" filter="url(#glow-pink)" />

  <!-- Decorative Sparkles / Stars ✦ -->
  <text x="28" y="75" fill="#ee50a5" font-size="18" opacity="0.8">✦</text>
  <text x="600" y="80" fill="#be54e6" font-size="14" opacity="0.6">✧</text>
  <text x="640" y="225" fill="#ee50a5" font-size="16" opacity="0.7">✦</text>
  <text x="220" y="235" fill="#8e44ad" font-size="12" opacity="0.5">✧</text>

  <!-- Main Content Area -->
  <!-- Left Side: Typography -->
  <g transform="translate(48, 70)">
    <!-- Cute Pill Badge -->
    <rect x="0" y="0" width="235" height="24" rx="12" fill="#36173d" stroke="#ee50a5" stroke-width="1" />
    <text x="14" y="16" class="font-badge">✨ PRODUCT ARCHITECT &amp; DEV</text>

    <!-- Main Name Title with Heart & Cute Accents -->
    <text x="0" y="58" class="font-title" fill="url(#pink-violet-grad)">Cintia Losada</text>
    <text x="310" y="58" class="font-title" fill="#ffffff" opacity="0.95">/ CinloDev</text>

    <!-- Subtitle -->
    <text x="0" y="94" class="font-sub">Frontend Engineer &amp; Product Developer</text>

    <!-- Technical Focus Tagline -->
    <text x="0" y="126" class="font-tagline">&gt; High-Performance Web Apps • B2B SaaS • AI Coding Agent Tooling</text>
    <text x="0" y="148" class="font-tagline" fill="#8e44ad">&gt; Next.js 16 • React 19 • TypeScript • Supabase • TailwindCSS</text>
  </g>

  <!-- Right Side: Pixel Neko Tech Card / Mascot -->
  <g transform="translate(685, 62)">
    <!-- Mascot Frame -->
    <rect width="165" height="175" rx="14" fill="#201124" stroke="#8e44ad" stroke-width="1.4" />
    <rect x="4" y="4" width="157" height="167" rx="10" stroke="#ee50a5" stroke-width="0.8" stroke-opacity="0.4" />

    <!-- Cute Neko Face Vector Illustration -->
    <!-- Ears -->
    <polygon points="40,68 55,30 76,56" fill="url(#neko-grad)" />
    <polygon points="48,64 56,38 70,55" fill="#fca5d5" opacity="0.85" />

    <polygon points="125,68 110,30 89,56" fill="url(#neko-grad)" />
    <polygon points="117,64 109,38 95,55" fill="#fca5d5" opacity="0.85" />

    <!-- Head -->
    <ellipse cx="82.5" cy="74" rx="44" ry="34" fill="#2d1732" stroke="#8e44ad" stroke-width="2" />

    <!-- Happy Cute Eyes (Curved Arches) -->
    <path d="M 60 72 Q 68 63 74 72" stroke="#ff8cc6" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 91 72 Q 97 63 105 72" stroke="#ff8cc6" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Rosy Cheeks -->
    <ellipse cx="56" cy="81" rx="6" ry="4" fill="#ee50a5" fill-opacity="0.65" filter="url(#glow-soft)" />
    <ellipse cx="109" cy="81" rx="6" ry="4" fill="#ee50a5" fill-opacity="0.65" filter="url(#glow-soft)" />

    <!-- Cute Nose & Mouth (3 shape) -->
    <path d="M 82.5 78 L 82.5 82 M 82.5 82 Q 77 87 73 82 M 82.5 82 Q 88 87 92 82" stroke="#ffbade" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Whiskers -->
    <line x1="32" y1="76" x2="48" y2="78" stroke="#8e44ad" stroke-width="1.6" stroke-linecap="round" />
    <line x1="30" y1="86" x2="47" y2="84" stroke="#8e44ad" stroke-width="1.6" stroke-linecap="round" />
    <line x1="133" y1="76" x2="117" y2="78" stroke="#8e44ad" stroke-width="1.6" stroke-linecap="round" />
    <line x1="135" y1="86" x2="118" y2="84" stroke="#8e44ad" stroke-width="1.6" stroke-linecap="round" />

    <!-- Card Subtitle / Label below mascot -->
    <rect x="22" y="125" width="121" height="22" rx="11" fill="#311538" stroke="#ee50a5" stroke-width="1" />
    <text x="82.5" y="140" text-anchor="middle" class="font-badge" font-size="10.5" fill="#fcd5ec">NEKO-TECH OS</text>
    
    <text x="82.5" y="162" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a085a6">/ᐠ. ｡.ᐟ\ ᨐ ∫</text>
  </g>
</svg>
