<svg width="850" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1218" />
      <stop offset="50%" stop-color="#241424" />
      <stop offset="100%" stop-color="#160e16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ee50a5" />
      <stop offset="50%" stop-color="#b455d3" />
      <stop offset="100%" stop-color="#8e44ad" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#8e44ad" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
      fill: #e0d6e6;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #d5c8dc;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 13px;
      fill: #a38fa8;
    }
  </style>

  <!-- Background Base -->
  <rect width="850" height="220" rx="16" fill="url(#bg-grad)" />
  
  <!-- Subtle Dot Grid Overlay -->
  <rect width="850" height="220" rx="16" fill="url(#grid)" />

  <!-- Outer Double Border -->
  <rect x="1.5" y="1.5" width="847" height="217" rx="15" stroke="#8e44ad" stroke-width="1.5" stroke-opacity="0.8" />
  <rect x="5.5" y="5.5" width="839" height="209" rx="11" stroke="#5c2c74" stroke-width="1" stroke-opacity="0.5" />

  <!-- Decorative Corner Accents -->
  <path d="M 6 30 L 6 6 L 30 6" stroke="#ee50a5" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 820 6 L 844 6 L 844 30" stroke="#8e44ad" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 844 190 L 844 214 L 820 214" stroke="#ee50a5" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 30 214 L 6 214 L 6 190" stroke="#8e44ad" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Ambient Light Sphere -->
  <circle cx="100" cy="50" r="70" fill="#ee50a5" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="750" cy="170" r="90" fill="#8e44ad" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Tag Pill -->
  <g transform="translate(48, 38)">
    <rect width="186" height="26" rx="13" fill="#361c48" stroke="#8e44ad" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#ee50a5" />
    <text x="26" y="17.5" class="badge-text">FRONTEND &amp; AI TOOLING</text>
  </g>

  <!-- Main Name Title -->
  <text x="48" y="105" class="title" fill="url(#accent-grad)">Cintia Losada</text>
  <text x="315" y="105" class="title" fill="#ffffff" opacity="0.95">/ CinloDev</text>

  <!-- Subtitle -->
  <text x="48" y="140" class="subtitle">Frontend Engineer &amp; Product Developer</text>

  <!-- Tagline / Focus -->
  <text x="48" y="172" class="tagline">SaaS Architecture • Next.js &amp; TypeScript Ecosystems • AI Coding Agents &amp; DevTools</text>

  <!-- Decorative Status Indicator (Right aligned) -->
  <g transform="translate(640, 40)">
    <rect width="160" height="30" rx="8" fill="#201323" stroke="#8e44ad" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="18" cy="15" r="4" fill="#10B981" />
    <text x="30" y="19" class="badge-text" fill="#e0d6e6">Open to collaborate</text>
  </g>
</svg>
